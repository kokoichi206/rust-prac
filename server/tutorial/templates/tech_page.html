<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{{tech.name}} Page</title>
  </head>

  <body>
    <h1>{{tech.name}}</h1>
    <hr />
    <div>
      <img
        src="{{tech.image_url}}"
        class="logo"
        width="100px"
        alt="{{tech.name}} Logo"
      />
    </div>
    <hr />
    <div>
      {% for project in projects %} {{loop.index}}.
      <a href="/projects/{{ project.url_name }}">{{ project.name }}</a> <br />
      {% endfor %}
    </div>
  </body>
</html>
